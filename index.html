<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الإلكتروني الفخم والأذكار</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>
        window.onerror = function(msg, url, line) { alert("🚨 مصيدة الأخطاء:\n" + msg + "\nفي السطر: " + line); return false; };
    </script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area"><i class="fas fa-quran animated-quran"></i><h1>المُصْحَفُ الشَّرِيفُ</h1></div>
            <p class="subtitle">تصفح مرن بسحب الشاشة لليسار • أذكار كاملة بالعداد التفاعلي</p>
            <div class="main-tabs">
                <button onclick="switchTab('quran')" id="tab-quran" class="tab-btn active-tab"><i class="fas fa-book-open"></i> فهرس السور</button>
                <button onclick="switchTab('azkar')" id="tab-azkar" class="tab-btn"><i class="fas fa-pray"></i> الأذكار والتحصين</button>
            </div>
        </header>

        <!-- قسم القرآن التفاعلي الحريري -->
        <div id="quran-section" class="tab-content">
            <div id="surahs-index-view">
                <h3 class="section-title">فهرس سور القرآن الكريم:</h3>
                <div class="surahs-grid" id="surahs-container"></div>
            </div>
            
            <!-- شاشة عرض الصفحات الأصلية بسحب اللمس لليسار -->
            <div id="surah-reading-view" class="hidden">
                <div class="navigation-bar">
                    <button onclick="backToSurahsIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الفهرس</button>
                    <h3 id="current-surah-title" class="surah-header-title">سورة</h3>
                    <span id="page-number-indicator" class="page-indicator-badge">صفحة 1</span>
                </div>
                
                <!-- منطقة السحب الحركي باللمس لليسار واليمين سلسة جداً -->
                <div class="quran-swiper-container" id="swiper-box">
                    <div class="swiper-wrapper-page" id="quran-page-holder">
                        <img id="quran-page-img" src="" alt="صفحة المصحف الشريف">
                    </div>
                    <!-- أزرار تنقل جانبية احتياطية للموبايل والويب -->
                    <button onclick="nextPage()" class="nav-arrow-btn left-arrow"><i class="fas fa-chevron-left"></i></button>
                    <button onclick="prevPage()" class="nav-arrow-btn right-arrow"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- قسم الأذكار والمسبحة -->
        <div id="azkar-section" class="tab-content hidden">
            <div id="azkar-index-view">
                <h3 class="section-title">أذكار الحفظ والتحصين اليومي المكتملة:</h3>
                <div class="azkar-categories-grid">
                    <div class="azkar-card category-sabah" onclick="loadAzkarData('sabah', 'أذكار الصباح كاملة ☀️')"><i class="fas fa-sun"></i><h3>أذكار الصباح كاملة</h3></div>
                    <div class="azkar-card category-masaa" onclick="loadAzkarData('masaa', 'أذكار المساء كاملة 🌙')"><i class="fas fa-moon"></i><h3>أذكار المساء كاملة</h3></div>
                </div>
            </div>
            <div id="azkar-list-view" class="hidden">
                <div class="navigation-bar"><button onclick="backToAzkarIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الأقسام</button><h3 id="current-azkar-title" class="section-title"></h3></div>
                <div class="azkar-list-container" id="azkar-container"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.protocol + "//" + window.location.host;
        let startPageNum = 1, endPageNum = 1, currentPageNum = 1;
        let touchStartX = 0, touchEndX = 0;

        window.onload = function() { loadSurahsIndex(); initSwipeDetection(); };

        function switchTab(t) {
            document.getElementById('quran-section').classList.add('hidden'); document.getElementById('azkar-section').classList.add('hidden');
            document.getElementById('tab-quran').classList.remove('active-tab'); document.getElementById('tab-azkar').classList.remove('active-tab');
            if(t === 'quran') { document.getElementById('quran-section').classList.remove('hidden'); document.getElementById('tab-quran').classList.add('active-tab'); backToSurahsIndex(); }
            else { document.getElementById('azkar-section').classList.remove('hidden'); document.getElementById('tab-azkar').classList.add('active-tab'); backToAzkarIndex(); }
        }

        async function loadSurahsIndex() {
            try {
                const r = await fetch(`${SERVER_URL}/api/surahs`), s = await r.json(), container = document.getElementById('surahs-container'); container.innerHTML = "";
                s.forEach(surah => {
                    const card = document.createElement('div'); card.className = "surah-item-card"; 
                    card.onclick = () => startReadingSurah(surah.name, surval = surah.start_page, surah.end_page);
                    card.innerHTML = `<div class="surah-meta"><span class="surah-number">${surah.id}</span><div class="surah-name-box"><h3>سُورَةُ ${surah.name}</h3><p>${surah.type} • تبدأ من صفحة ${surah.start_page}</p></div></div><i class="fas fa-chevron-left gold-arrow"></i>`; container.appendChild(card);
                });
            } catch (e) { alert("خطأ بالفهرس"); }
        }

        function startReadingSurah(name, start, end) {
            startPageNum = start; endPageNum = end; currentPageNum = start;
            document.getElementById('current-surah-title').innerText = "سُورَةُ " + name;
            renderQuranPage();
            document.getElementById('surahs-index-view').classList.add('hidden'); document.getElementById('surah-reading-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // دالة عرض الصفحة المصورة الفخمة مع تفعيل ميزة التحميل المسبق فائقة السلاسة
        function renderQuranPage() {
            // نقوم بجلب الصفحة المصورة الرسمية للمصحف الشريف بجودة عالية جداً وثابتة طيران
            // نستخدم السيرفر العالمي المفتوح لصفحات المصحف لضمان النقاء المطلق والسرعة
            let paddedPage = String(currentPageNum).padStart(3, '0');
            const imgElement = document.getElementById('quran-page-img');
            imgElement.src = `https://amazonaws.com{paddedPage}.png`;
            document.getElementById('page-number-indicator').innerText = "صفحة " + currentPageNum;
            
            // تحميل مسبق خفي (Preloading) للصفحة التالية لكي تقلب لليسار كالحرير بدون ثانية واحدة انتظار!
            if(currentPageNum < endPageNum) {
                let nextPadded = String(currentPageNum + 1).padStart(3, '0');
                const imgPreload = new Image();
                imgPreload.src = `https://amazonaws.com{nextPadded}.png`;
            }
        }

        function nextPage() { if(currentPageNum < endPageNum) { currentPageNum++; renderQuranPage(); triggerFlipAnimation(); } }
        function prevPage() { if(currentPageNum > startPageNum) { currentPageNum--; renderQuranPage(); triggerFlipAnimation(); } }

        // أنيميشن ناعم جداً وسلس كالحرير عند انزلاق الصفحات
        function triggerFlipAnimation() {
            const holder = document.getElementById('quran-page-holder');
            holder.style.opacity = "0.4"; holder.style.transform = "translateX(-15px)";
            setTimeout(() => { holder.style.opacity = "1"; holder.style.transform = "translateX(0)"; }, 120);
        }

        // 🎯 برمجة نظام الاستشعار باللمس والسحب لليسار فائق السلاسة (Fluid Touch Swipe)
        function initSwipeDetection() {
            const box = document.getElementById('swiper-box');
            box.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
            box.addEventListener('touchend', e => { 
                touchEndX = e.changedTouches[0].screenX;
                handleSwipeGesture();
            }, {passive: true});
        }

        function handleSwipeGesture() {
            // سحب لليسار (تعني الصفحة التالية في المصاحف)
            if (touchStartX - touchEndX > 50) nextPage();
            // سحب لليمين (تعني الصفحة السابقة)
            if (touchEndX - touchStartX > 50) prevPage();
        }

        function backToSurahsIndex() { document.getElementById('surah-reading-view').classList.add('hidden'); document.getElementById('surahs-index-view').classList.remove('hidden'); }

        async function loadAzkarData(cat, title) {
            try {
                document.getElementById('current-azkar-title').innerText = title;
                const r = await fetch(`${SERVER_URL}/api/azkar?category=${cat}`), az = await r.json(), container = document.getElementById('azkar-container'); container.innerHTML = "";
                az.forEach((a, i) => {
                    const card = document.createElement('div'); card.className = "zekr-box-card";
                    card.innerHTML = `<p class="zekr-text">${a.text}</p><div class="counter-area"><button id="counter-btn-${i}" onclick="decreaseCounter(${i})" class="tasbeeh-btn"><span class="count-num" id="count-val-${i}">${a.count}</span><span class="count-lbl">تكرار</span></button></div>`; container.appendChild(card);
                });
                document.getElementById('azkar-index-view').classList.add('hidden'); document.getElementById('azkar-list-view').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) { alert("خطأ بالأذكار"); }
        }

        function decreaseCounter(i) {
