<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب كول</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://socket.io"></script>
    
    <!-- مصيدة الأخطاء الشاملة المطورة بناء على فكرتك الذكية -->
    <script>
        // مصفوفة لتجميع كافة الأخطاء في الصفحة
        window.allErrorsList = [];
        
        window.onerror = function(msg, url, line, col, error) {
            var errorLog = "🔴 خطأ: " + msg + "\n← في السطر: " + line + " (عمود: " + col + ")";
            window.allErrorsList.push(errorLog);
            
            // عرض لستة الأخطاء كاملة ومجمعة في نافذة واحدة فوراً
            setTimeout(function() {
                if(window.allErrorsList.length > 0) {
                    alert("🚨 تقرير الأخطاء الشامل المجمّع:\n\n" + window.allErrorsList.join("\n\n") + "\n\nبرجاء تصوير الشاشة وإرسالها للمعالجة الفورية!");
                    window.allErrorsList = []; // تفريغ بعد العرض
                }
            }, 100);
            return false;
        };
    </script>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="screen">
        <div class="auth-container">
            <div class="auth-header">
                <i class="fab fa-whatsapp" style="color:#00a884;font-size:50px;margin-bottom:10px;"></i>
                <h2>مرحباً بك في واتساب كول</h2>
            </div>
            
            <div id="login-form-box" class="form-box">
                <h3>تسجيل الدخول</h3>
                <input type="text" id="login-username" placeholder="اسم المستخدم" required>
                <input type="password" id="login-pass" placeholder="كلمة المرور" required>
                <button type="button" onclick="handleLogin(event)">دخول</button>
                <p>ليس لديك حساب؟ <span onclick="toggleAuthForms()" style="color:#00a884; cursor:pointer; font-weight:bold;">إنشاء حساب جديد</span></p>
            </div>

            <div id="register-form-box" class="form-box hidden">
                <h3>إنشاء حساب جديد</h3>
                <div class="avatar-upload-box">
                    <label for="reg-avatar" class="avatar-label">
                        <div class="avatar-circle large" id="avatar-preview"><i class="fas fa-camera"></i></div>
                        <span>اختر صورة شخصية</span>
                    </label>
                    <input type="file" id="reg-avatar" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
                </div>
                <input type="text" id="reg-username" placeholder="اسم المستخدم الفريد" required>
                <input type="password" id="reg-pass" placeholder="كلمة المرور" required>
                <button type="button" onclick="handleRegister(event)">تسجيل وتفعيل الحساب</button>
                <p>لديك حساب بالفعل؟ <span onclick="toggleAuthForms()" style="color:#00a884; cursor:pointer; font-weight:bold;">تسجيل الدخول</span></p>
            </div>
        </div>
    </div>

    <!-- واجهة الشات الرئيسية المتجاوبة -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-app-container">
            <aside class="sidebar" id="app-sidebar">
                <header class="sidebar-header">
                    <div class="user-profile" onclick="openMyProfile()">
                        <div class="avatar-circle" id="my-avatar-view"><i class="fas fa-user"></i></div>
                        <span id="current-user-name" style="font-weight:bold;">المستخدم</span>
                    </div>
                    <div class="header-actions">
                        <button onclick="openStoryModal()" class="header-icon-btn" title="حالة جديدة"><i class="fas fa-circle-notch"></i></button>
                        <button onclick="logout()" class="logout-btn" title="تسجيل الخروج"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </header>

                <div class="stories-wrapper">
                    <h4>الحالات الحديثة</h4>
                    <div class="stories-bar" id="stories-container"></div>
                </div>

                <div class="search-bar-container">
                    <div class="search-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="search-username" placeholder="ابحث عن صديق واضغط Enter..." onkeypress="handleSearch(event)">
                    </div>
                </div>

                <div class="chats-list" id="chats-list-container"></div>
            </aside>

            <main class="chat-area hidden-mobile" id="app-chat-area">
                <div id="welcome-chat-view" class="welcome-view">
                    <i class="fab fa-whatsapp" style="font-size:70px;color:#ced5d8;margin-bottom:15px;"></i>
                    <h2>واتساب كول للموبايل والويب</h2>
                    <p>أرسل واستقبل الرسائل فورياً بصور البروفايل وحذف الرسائل من الطرفين.</p>
                </div>

                <div id="active-chat-view" class="active-view hidden">
                    <header class="chat-header">
                        <button onclick="backToSidebar()" class="back-btn"><i class="fas fa-arrow-right"></i></button>
                        <div class="active-user-info" onclick="openFriendProfile()">
                            <div class="avatar-circle" id="active-chat-avatar"><i class="fas fa-user"></i></div>
                            <div>
                                <h4 id="active-chat-name">اسم الصديق</h4>
                                <span id="typing-status" class="typing-text"></span>
                            </div>
                        </div>
                    </header>
                    
                    <div class="messages-container" id="messages-box"></div>
                    
                    <div class="emoji-drawer hidden" id="emoji-box">
                        <span onclick="insertEmoji('😀')">😀</span><span onclick="insertEmoji('😂')">😂</span><span onclick="insertEmoji('😍')">😍</span><span onclick="insertEmoji('👍')">👍</span>
                        <span onclick="insertEmoji('🌹')">🌹</span><span onclick="insertEmoji('🎉')">🎉</span><span onclick="insertEmoji('❤️')">❤️</span>
                    </div>

                    <footer class="chat-footer">
                        <button onclick="toggleEmojiBox()" class="footer-icon-btn"><i class="far fa-smile"></i></button>
                        <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="handleSendMessage(event)" oninput="emitTyping()">
                        <button onclick="sendMessage()" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <!-- النوافذ العائمة -->
    <div id="profile-modal" class="modal-backdrop hidden" onclick="closeProfileModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>الملف الشخصي</h3>
            <div class="avatar-circle large text-center" id="modal-profile-avatar" style="margin: 15px auto;"></div>
            <h2 id="modal-profile-name"></h2>
            <p id="modal-profile-bio"></p>
            <button onclick="closeProfileModal()" class="close-modal-btn">إغلاق</button>
        </div>
    </div>

    <div id="story-modal" class="modal-backdrop hidden" onclick="closeStoryModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>نشر حالة جديدة</h3>
            <input type="text" id="story-text" placeholder="اكتب نص الحالة هنا..." style="width:100%; padding:10px; margin:15px 0; border:1px solid #ccc; border-radius:8px;">
            
            <div style="margin: 10px 0;">
                <label for="story-file" style="background:#f0f2f5; padding:8px 15px; border-radius:8px; cursor:pointer; display:inline-block; font-size:14px; font-weight:bold; color:#54656f;">
                    <i class="fas fa-paperclip"></i> ارفق صورة أو فيديو من الموبايل
                </label>
                <input type="file" id="story-file" accept="image/*,video/*" style="display:none;" onchange="handleStoryFileSelect(event)">
                <div id="story-file-status" style="font-size:12px; color:#00a884; margin-top:5px; font-weight:bold;"></div>
            </div>

            <button onclick="uploadStory()" class="close-modal-btn" style="background:#00a884; margin-top:5px;">نشر الحالة الآن</button>
        </div>
    </div>

    <div id="story-view-modal" class="modal-backdrop hidden" onclick="closeStoryViewModal()" style="background:rgba(0,0,0,0.9);">
        <div class="modal-content" onclick="event.stopPropagation()" style="background:transparent; box-shadow:none; max-width:450px; width:95%;">
            <h4 id="story-view-username" style="color:white; margin-bottom:15px; text-align:right;"></h4>
            <div id="story-view-body" style="width:100%; max-height:70vh; display:flex; justify-content:center; align-items:center;"></div>
            <p id="story-view-text" style="color:white; margin-top:15px; font-size:16px; background:rgba(0,0,0,0.6); padding:10px; border-radius:8px;"></p>
            <button onclick="closeStoryViewModal()" class="close-modal-btn" style="background:#ea0038; margin-top:20px;">إغلاق الحالة</button>
        </div>
    </div>

    <audio id="notif-sound" src="https://mixkit.co" preload="auto"></audio>
    <script src="app.js?v=2.0"></script>
    
</body>
</html>
