<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <div class="whatsapp-logo">🟢</div>
            <h2>مرحباً بك في خالد شات</h2>
            <p>أول تسجيل لك؟ سيتم حفظ الباسورد لحماية حسابك مدى الحياة.</p>
            <input type="text" id="login-name" placeholder="اكتب اسمك (للتسجيل لأول مرة)">
            <input type="tel" id="login-phone" placeholder="اكتب رقم موبايلك (مثال: 011...)">
            <input type="password" id="login-pass" placeholder="اكتب كلمة السر الخاصة بك">
            <button id="login-btn">دخول / تسجيل جديد</button>
        </div>
    </div>

    <!-- شاشة الشات الرئيسية -->
    <div id="chat-screen" class="screen hidden">
        <header class="chat-header">
            <div class="user-info">
                <span id="current-user-display"></span>
            </div>
            <h2>غرفة المحادثة</h2>
        </header>

        <div class="search-bar">
            <input type="tel" id="search-phone" placeholder="ابحث برقم موبايل صاحبك...">
            <button id="search-btn">بحث</button>
        </div>

        <div id="chat-box" class="chat-box">
            <p class="welcome-msg">ابحث عن صديق لبدء المحادثة السريعة أونلاين...</p>
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
            <button id="send-btn">إرسال</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
