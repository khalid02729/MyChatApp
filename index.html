<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الثانوية العامة 2027</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- 🎯 مصيدة أخطاء المتصفح والـ HTML الشاملة المجمّعة -->
    <script>
        window.allHtmlErrors = [];
        window.onerror = function(msg, url, line, col) {
            var log = "🔴 خطأ واجهة: " + msg + "\n← في السطر: " + line + " (عمود: " + col + ")";
            window.allHtmlErrors.push(log);
            setTimeout(function() {
                if(window.allHtmlErrors.length > 0) {
                    alert("🚨 تقرير مصيدة أخطاء الواجهة المجمّع:\n\n" + window.allHtmlErrors.join("\n\n"));
                    window.allHtmlErrors = [];
                }
            }, 100);
            return false;
        };
    </script>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر العلوي الفخم -->
        <header class="app-header">
            <div class="logo-area">
                <i class="fas fa-graduation-cap animated-cap"></i>
                <h1>ثانوية عامة 2027</h1>
            </div>
            <p class="subtitle">تصفح وقراءة الكتب الخارجية مباشرة وبكامل حريتك</p>
        </header>

        <!-- الشاشة الأولى: اختيار الشعبة -->
        <div id="track-screen" class="screen-view">
            <h3 class="section-title">اختر الشعبة الدراسية للبدء:</h3>
            <div class="tracks-grid">
                <div class="track-card" onclick="loadSubjects('elmi_oloom')">
                    <div class="icon-circle oloom"><i class="fas fa-flask"></i></div>
                    <h3>علمي علوم</h3>
                    <p>كيمياء، فيزياء، أحياء...</p>
                </div>
                <div class="track-card" onclick="loadSubjects('elmi_riada')">
                    <div class="icon-circle riada"><i class="fas fa-calculator"></i></div>
                    <h3>علمي رياضة</h3>
                    <p>كيمياء، فيزياء، رياضيات...</p>
                </div>
                <div class="track-card" onclick="loadSubjects('adabi')">
                    <div class="icon-circle adabi"><i class="fas fa-book-open"></i></div>
                    <h3>أدبي</h3>
                    <p>تاريخ، جغرافيا، فلسفة، علم نفس...</p>
                </div>
            </div>
        </div>

        <!-- الشاشة الثانية: قائمة المواد (تدخلك للكتاب مباشر) -->
        <div id="subjects-screen" class="screen-view hidden">
            <div class="navigation-bar">
                <button onclick="showScreen('track-screen')" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للشعب</button>
                <h3 id="current-track-title" class="section-title">المواد الدراسية - اضغط لفتح الكتاب فوراً</h3>
            </div>
            <div class="subjects-grid" id="subjects-container"></div>
        </div>
    </div>

    <!-- كود الحركة والاتصال المباشر بالسيرفر -->
    <script>
        const SERVER_URL = window.location.protocol + "//" + window.location.host;

        function showScreen(screenId) {
            document.querySelectorAll('.screen-view').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        // دالة جلب المواد بناءً على الشعبة
        async function loadSubjects(trackName) {
            let report = ["📋 تقرير مصيدة أخطاء جلب المواد:"];
            try {
                var titleMap = { 'elmi_oloom': 'شعبة علمي علوم', 'elmi_riada': 'شعبة علمي رياضة', 'adabi': 'الشعبة الأدبية' };
                document.getElementById('current-track-title').innerText = titleMap[trackName] || "المواد الدراسية";
                
                const response = await fetch(`${SERVER_URL}/api/subjects?track=${trackName}`);
                const subjects = await response.json();
                
                const container = document.getElementById('subjects-container');
                container.innerHTML = "";
                
                subjects.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = "subject-card";
                    
                    // 🎯 التعديل الخارق هنا: عند الضغط على المادة تذهب فوراً لجلب كتابها وفتحه مباشرة
                    card.onclick = () => openBookDirectly(sub.id);
                    
                    card.innerHTML = `
                        <div class="subject-info">
                            <i class="fas fa-book-bookmark"></i>
                            <h3>${sub.name}</h3>
                        </div>
                        <span class="direct-open-text">فتح الكتاب <i class="fas fa-external-link-alt"></i></span>
                    `;
                    container.appendChild(card);
                });
                
                showScreen('subjects-screen');
            } catch (err) {
                report.push("💥 تعذر الاتصال بالسيرفر وجلب قائمة المواد");
                report.push("📝 تفاصيل الخطأ: " + err.message);
                alert(report.join("\n\n"));
            }
        }

        // 🎯 دالة الفتح المباشر للكتاب في صفحة كاملة بدون نوافذ صغيرة
        async function openBookDirectly(subjectId) {
            let report = ["📋 تقرير مصيدة أخطاء فتح الكتاب المباشر:"];
            try {
                // نطلب من السيرفر الكتب المتاحة لهذه المادة
                const response = await fetch(`${SERVER_URL}/api/books?subject_id=${subjectId}`);
                const books = await response.json();
                
                if (books.length === 0) {
                    alert("جاري رفع وتجهيز كتاب هذه المادة حالياً على السيرفر!");
                    return;
                }
                
                // نأخذ رابط أول كتاب متاح للمادة (مثل المنهج أو الشرح الأساسي)
                const targetPdfUrl = books[0].pdf_url;
                
                // نفتح الرابط فوراً وبشكل مباشر كامل لكي يتصفح الطالب ويبحث بحريته المطلقة وبحسب حجم الكتاب
                window.location.href = targetPdfUrl;
                
            } catch (err) {
                report.push("💥 فشل السيرفر في تمرير رابط الكتاب المباشر");
                report.push("📝 تفاصيل الخطأ: " + err.message);
                alert(report.join("\n\n"));
            }
        }
    </script>
</body>
</html>
