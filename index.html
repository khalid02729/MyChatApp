<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المصحف الشريف والأذكار</title>

    <link rel="stylesheet" href="style.css">

    <!-- مصيدة الأخطاء — سيبناها زي ما طلبت -->
    <script>
        window.onerror = function (m, u, l) {
            alert("🚨 مصيدة الأخطاء:\n" + m + "\nفي السطر: " + l);
            return false;
        };
    </script>
</head>

<body>

<div class="app-container">

    <!-- ================= HEADER ================= -->

    <header class="app-header">

        <div class="logo-area">
            <span class="quran-logo">📖</span>
            <h1>المُصْحَفُ الشَّرِيفُ</h1>
        </div>

        <p class="subtitle">
            القرآن الكريم والأذكار اليومية
        </p>

        <div class="main-tabs">
            <button
                onclick="switchTab('quran')"
                id="tab-quran"
                class="tab-btn active-tab">
                القرآن الكريم
            </button>

            <button
                onclick="switchTab('azkar')"
                id="tab-azkar"
                class="tab-btn">
                الأذكار
            </button>
        </div>

    </header>


    <!-- ================= QURAN ================= -->

    <div id="quran-section" class="tab-content">

        <!-- الفهرس -->

        <div id="surahs-index-view">

            <h3 class="section-title">
                فهرس سور القرآن الكريم
            </h3>

            <div class="search-box">
                <input
                    id="surah-search"
                    type="text"
                    placeholder="🔎 ابحث عن سورة..."
                    oninput="searchSurahs()">
            </div>

            <div
                class="surahs-grid"
                id="surahs-container">
            </div>

        </div>


        <!-- شاشة المصحف -->

        <div id="surah-reading-view" class="hidden">

            <div class="navigation-bar">

                <button
                    onclick="backToSurahsIndex()"
                    class="back-btn">
                    ← الفهرس
                </button>

                <h3
                    id="current-surah-title"
                    class="surah-header-title">
                </h3>

                <button
                    onclick="goToBookmark()"
                    class="bookmark-top-btn">
                    🔖
                </button>

            </div>


            <!-- رقم الصفحة -->

            <div class="page-info">
                <span id="page-number">
                    صفحة 1 / 1
                </span>
            </div>


            <!-- المصحف -->

            <div
                id="quran-book"
                class="quran-book">

                <div
                    id="pages-container"
                    class="pages-container">
                </div>

            </div>


            <!-- أسهم التنقل -->

            <div class="page-controls">

                <button
                    onclick="previousPage()"
                    class="page-btn">
                    ❯
                </button>

                <button
                    onclick="nextPage()"
                    class="page-btn">
                    ❮
                </button>

            </div>


            <div class="swipe-hint">
                اسحب يمينًا أو يسارًا للتنقل بين الصفحات
            </div>

        </div>

    </div>


    <!-- ================= AZKAR ================= -->

    <div id="azkar-section" class="tab-content hidden">

        <div id="azkar-index-view">

            <h3 class="section-title">
                الأذكار اليومية
            </h3>

            <div class="azkar-categories-grid">

                <div
                    class="azkar-card category-sabah"
                    onclick="loadAzkarData('sabah','أذكار الصباح ☀️')">

                    <div class="azkar-icon">☀️</div>

                    <h3>
                        أذكار الصباح
                    </h3>

                    <p>
                        الأذكار كاملة
                    </p>

                </div>


                <div
                    class="azkar-card category-masaa"
                    onclick="loadAzkarData('masaa','أذكار المساء 🌙')">

                    <div class="azkar-icon">🌙</div>

                    <h3>
                        أذكار المساء
                    </h3>

                    <p>
                        الأذكار كاملة
                    </p>

                </div>

            </div>

        </div>


        <div
            id="azkar-list-view"
            class="hidden">

            <div class="navigation-bar">

                <button
                    onclick="backToAzkarIndex()"
                    class="back-btn">
                    ← الأقسام
                </button>

                <h3
                    id="current-azkar-title"
                    class="surah-header-title">
                </h3>

            </div>

            <div
                class="azkar-list-container"
                id="azkar-container">
            </div>

        </div>

    </div>

</div>


<script>

const SERVER_URL =
    window.location.protocol +
    "//" +
    window.location.host;


/* =========================================
   متغيرات المصحف
========================================= */

let currentSurah = null;
let currentSurahId = null;

let currentPage = 0;
let pages = [];

let allSurahs = [];


/* =========================================
   بداية البرنامج
========================================= */

window.onload = function () {
    loadSurahsIndex();
};


/* =========================================
   التبويبات
========================================= */

function switchTab(tab) {

    document
        .getElementById("quran-section")
        .classList.add("hidden");

    document
        .getElementById("azkar-section")
        .classList.add("hidden");

    document
        .getElementById("tab-quran")
        .classList.remove("active-tab");

    document
        .getElementById("tab-azkar")
        .classList.remove("active-tab");


    if (tab === "quran") {

        document
            .getElementById("quran-section")
            .classList.remove("hidden");

        document
            .getElementById("tab-quran")
            .classList.add("active-tab");

        backToSurahsIndex();

    } else {

        document
            .getElementById("azkar-section")
            .classList.remove("hidden");

        document
            .getElementById("tab-azkar")
            .classList.add("active-tab");

        backToAzkarIndex();
    }
}


/* =========================================
   تحميل فهرس السور
========================================= */

async function loadSurahsIndex() {

    const container =
        document.getElementById("surahs-container");

    container.innerHTML =
        `<div class="loading-text">جاري تحميل السور...</div>`;

    try {

        const response =
            await fetch(`${SERVER_URL}/api/surahs`);

        if (!response.ok)
            throw new Error("تعذر تحميل السور");

        allSurahs =
            await response.json();

        renderSurahs(allSurahs);

    } catch (error) {

        container.innerHTML =
            `<div class="error-box">
                ❌ حدث خطأ أثناء تحميل فهرس السور
            </div>`;

        throw error;
    }
}


/* =========================================
   عرض السور
========================================= */

function renderSurahs(surahs) {

    const container =
        document.getElementById("surahs-container");

    container.innerHTML = "";

    if (!surahs.length) {

        container.innerHTML =
            `<div class="error-box">
                لا توجد نتائج
            </div>`;

        return;
    }


    surahs.forEach(surah => {

        const card =
            document.createElement("div");

        card.className =
            "surah-item-card";


        card.onclick = function () {

            loadSurahVerses(surah.id);

        };


        card.innerHTML = `

            <div class="surah-meta">

                <div class="surah-number">
                    ${surah.id}
                </div>

                <div class="surah-name-box">

                    <h3>
                        سُورَةُ ${surah.name}
                    </h3>

                    <p>
                        ${surah.type}
                    </p>

                </div>

            </div>

            <span class="gold-arrow">
                ❮
            </span>
        `;


        container.appendChild(card);

    });
}


/* =========================================
   البحث عن السور
========================================= */

function searchSurahs() {

    const input =
        document
        .getElementById("surah-search")
        .value
        .trim()
        .toLowerCase();


    const result =
        allSurahs.filter(surah => {

            return (
                surah.name
                .toLowerCase()
                .includes(input)
                ||
                String(surah.id)
                .includes(input)
            );

        });


    renderSurahs(result);
}


/* =========================================
   فتح السورة
========================================= */

async function loadSurahVerses(surahId) {

    try {

        const response =
            await fetch(
                `${SERVER_URL}/api/surah/${surahId}`
            );


        if (!response.ok)
            throw new Error("تعذر تحميل السورة");


        const data =
            await response.json();


        currentSurah =
            data;

        currentSurahId =
            surahId;


        document
            .getElementById("current-surah-title")
            .innerText =
            "سُورَةُ " + data.name;


        document
            .getElementById("surahs-index-view")
            .classList.add("hidden");


        document
            .getElementById("surah-reading-view")
            .classList.remove("hidden");


        createPages(data.verses);


        const savedBookmark =
            getBookmark(surahId);


        if (savedBookmark) {

            const verseIndex =
                data.verses.findIndex(
                    v =>
                    Number(v.verse_number) ===
                    Number(savedBookmark)
                );


            if (verseIndex >= 0) {

                currentPage =
                    findPageByVerse(verseIndex);

            } else {

                currentPage = 0;

            }

        } else {

            currentPage = 0;

        }


        showPage(currentPage);

        window.scrollTo(0, 0);

    } catch (error) {

        alert(
            "❌ حدث خطأ أثناء تحميل السورة"
        );

        throw error;
    }
}


/* =========================================
   إنشاء صفحات المصحف
========================================= */

function createPages(verses) {

    pages = [];

    /*
      كل صفحة تحتوي عددًا مناسبًا من الآيات.
      هذا تقسيم داخل التطبيق وليس ادعاءً
      بأنه مطابق لترقيم صفحات المصحف الورقي.
    */

    const versesPerPage = 8;


    let page = [];


    verses.forEach((verse, index) => {

        page.push({
            ...verse,
            originalIndex: index
        });


        if (
            page.length >= versesPerPage ||
            index === verses.length - 1
        ) {

            pages.push(page);

            page = [];

        }

    });


    renderPages();

}


/* =========================================
   إنشاء HTML للصفحات
========================================= */

function renderPages() {

    const container =
        document.getElementById("pages-container");


    container.innerHTML = "";


    pages.forEach((page, pageIndex) => {

        const pageElement =
            document.createElement("div");


        pageElement.className =
            "quran-page";


        pageElement.dataset.page =
            pageIndex;


        let html = "";


        /*
          البسملة
        */

        if (
            pageIndex === 0 &&
            currentSurahId !== 1 &&
            currentSurahId !== 9
        ) {

            html += `
                <div class="bismillah">
                    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
                </div>
            `;

        }


        page.forEach(verse => {

            const bookmark =
                getBookmark(currentSurahId);


            const isBookmarked =
                Number(bookmark) ===
                Number(verse.verse_number);


            html += `

                <span
                    class="single-verse
                    ${isBookmarked ? "bookmarked-verse" : ""}"
                    data-verse="${verse.verse_number}"
                    onclick="setBookmark(${verse.verse_number})">

                    ${verse.text}

                    <span class="verse-num-badge">
                        ﴿${verse.verse_number}﴾
                    </span>

                    ${
                        isBookmarked
                        ?
                        `<span class="bookmark-marker">🔖</span>`
                        :
                        ""
                    }

                </span>

            `;

        });


        pageElement.innerHTML =
            `<div class="quran-text">
                ${html}
            </div>`;


        container.appendChild(pageElement);

    });

}


/* =========================================
   عرض صفحة
========================================= */

function showPage(index) {

    if (!pages.length)
        return;


    if (index < 0)
        index = 0;


    if (index >= pages.length)
        index = pages.length - 1;


    currentPage =
        index;


    const pageElements =
        document.querySelectorAll(".quran-page");


    pageElements.forEach((page, i) => {

        page.classList.toggle(
            "active-page",
            i === currentPage
        );

    });


    document
        .getElementById("page-number")
        .innerText =
        `صفحة ${currentPage + 1} / ${pages.length}`;


    /*
      إعادة رسم الآية الحالية
      لإظهار علامة الوقف
    */

    updateBookmarkVisual();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================
   الصفحة التالية
========================================= */

function nextPage() {

    if (
        currentPage <
        pages.length - 1
    ) {

        showPage(
            currentPage + 1
        );

    }

}


/* =========================================
   الصفحة السابقة
========================================= */

function previousPage() {

    if (currentPage > 0) {

        showPage(
            currentPage - 1
        );

    }

}


/* =========================================
   البحث عن صفحة الآية
========================================= */

function findPageByVerse(index) {

    for (
        let i = 0;
        i < pages.length;
        i++
    ) {

        if (
            pages[i].some(
                v =>
                v.originalIndex === index
            )
        ) {

            return i;

        }

    }

    return 0;
}


/* =========================================
   السحب باللمس
========================================= */

let touchStartX = 0;
let touchStartY = 0;


const book =
    document.getElementById("quran-book");


book.addEventListener(
    "touchstart",
    function (event) {

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    { passive: true }
);


book.addEventListener(
    "touchend",
    function (event) {

        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const diffX =
            endX - touchStartX;

        const diffY =
            endY - touchStartY;


        /*
          نتأكد أن الحركة أفقية
        */

        if (
            Math.abs(diffX) >
            Math.abs(diffY) &&
            Math.abs(diffX) > 50
        ) {

            if (diffX < 0) {

                /*
                  سحب لليسار
                  الصفحة التالية
                */

                nextPage();

            } else {

                /*
                  سحب لليمين
                  الصفحة السابقة
                */

                previousPage();

            }

        }

    },
    { passive: true }
);


/* =========================================
   علامة "وقفت هنا"
========================================= */

function setBookmark(verseNumber) {

    const oldBookmark =
        getBookmark(currentSurahId);


    /*
      لو ضغط على نفس الآية مرة ثانية
      نشيل العلامة
    */

    if (
        Number(oldBookmark) ===
        Number(verseNumber)
    ) {

        localStorage.removeItem(
            "quran_bookmark_" +
            currentSurahId
        );

    } else {

        localStorage.setItem(
            "quran_bookmark_" +
            currentSurahId,
            verseNumber
        );

    }


    updateBookmarkVisual();

}


/* =========================================
   جلب العلامة
========================================= */

function getBookmark(surahId) {

    return localStorage.getItem(
        "quran_bookmark_" +
        surahId
    );

}


/* =========================================
   تحديث شكل العلامة
========================================= */

function updateBookmarkVisual() {

    const bookmark =
        getBookmark(currentSurahId);


    document
        .querySelectorAll(".single-verse")
        .forEach(verse => {

            const number =
                verse.dataset.verse;


            const oldMarker =
                verse.querySelector(
                    ".bookmark-marker"
                );


            verse.classList.remove(
                "bookmarked-verse"
            );


            if (oldMarker)
                oldMarker.remove();


            if (
                bookmark &&
                Number(bookmark) ===
                Number(number)
            ) {

                verse.classList.add(
                    "bookmarked-verse"
                );


                const marker =
                    document.createElement(
                        "span"
                    );


                marker.className =
                    "bookmark-marker";


                marker.innerText =
                    "🔖";


                verse.appendChild(
                    marker
                );

            }

        });

}


/* =========================================
   الذهاب لمكان الوقوف
========================================= */

function goToBookmark() {

    const bookmark =
        getBookmark(currentSurahId);


    if (!bookmark) {

        alert(
            "🔖 لم تحدد مكانًا للتوقف في هذه السورة."
        );

        return;

    }


    const verseIndex =
        currentSurah.verses.findIndex(
            v =>
            Number(v.verse_number) ===
            Number(bookmark)
        );


    if (verseIndex < 0)
        return;


    const page =
        findPageByVerse(
            verseIndex
        );


    showPage(page);


    setTimeout(() => {

        const verse =
            document.querySelector(
                `.single-verse[data-verse="${bookmark}"]`
            );


        if (verse) {

            verse.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }

    }, 200);

}


/* =========================================
   الرجوع للفهرس
========================================= */

function backToSurahsIndex() {

    document
        .getElementById("surah-reading-view")
        .classList.add("hidden");


    document
        .getElementById("surahs-index-view")
        .classList.remove("hidden");

}


/* =========================================
   الأذكار
========================================= */

async function loadAzkarData(
    category,
    title
) {

    try {

        document
            .getElementById(
                "current-azkar-title"
            )
            .innerText = title;


        const response =
            await fetch(
                `${SERVER_URL}/api/azkar?category=${category}`
            );


        if (!response.ok)
            throw new Error(
                "تعذر تحميل الأذكار"
            );


        const azkar =
            await response.json();


        const container =
            document.getElementById(
                "azkar-container"
            );


        container.innerHTML = "";


        azkar.forEach((zekr, index) => {

            const card =
                document.createElement("div");


            card.className =
                "zekr-box-card";


            card.innerHTML = `

                <p class="zekr-text">
                    ${zekr.text}
                </p>

                <div class="counter-area">

                    <button
                        id="counter-btn-${index}"
                        onclick="cnt(${index})"
                        class="tasbeeh-btn">

                        <span
                            class="count-num"
                            id="count-val-${index}">
                            ${zekr.count}
                        </span>

                        <span class="count-lbl">
                            تكرار
                        </span>

                    </button>

                </div>

            `;


            container.appendChild(card);

        });


        document
            .getElementById(
                "azkar-index-view"
            )
            .classList.add("hidden");


        document
            .getElementById(
                "azkar-list-view"
            )
            .classList.remove("hidden");


        window.scrollTo(0, 0);

    } catch (error) {

        alert(
            "❌ حدث خطأ أثناء تحميل الأذكار"
        );

        throw error;
    }

}


/* =========================================
   عداد الأذكار
========================================= */

function cnt(index) {

    const number =
        document.getElementById(
            `count-val-${index}`
        );


    const button =
        document.getElementById(
            `counter-btn-${index}`
        );


    let value =
        parseInt(number.innerText);


    if (value > 0) {

        value--;

        number.innerText =
            value;


        if (value === 0) {

            number.innerText =
                "✓";

            button.classList.add(
                "completed-counter"
            );

        }

    }

}


/* =========================================
   الرجوع للأذكار
========================================= */

function backToAzkarIndex() {

    document
        .getElementById(
            "azkar-list-view"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "azkar-index-view"
        )
        .classList.remove("hidden");

}

</script>

</body>
</html>
