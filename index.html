<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف والأذكار</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>
        window.onerror = function(msg, url, line) { alert("🚨 مصيدة الأخطاء:\n" + msg + "\nفي السطر: " + line); return false; };
    </script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area"><i class="fas fa-quran animated-quran"></i><h1>المصحف الشريف والأذكار</h1></div>
            <p class="subtitle">صدقة جارية - قراءة القرآن الكريم وأذكار الصباح والمساء</p>
            <div class="main-tabs">
                <button onclick="switchTab('quran')" id="tab-quran" class="tab-btn active-tab"><i class="fas fa-book-open"></i> سور القرآن</button>
                <button onclick="switchTab('azkar')" id="tab-azkar" class="tab-btn"><i class="fas fa-pray"></i> الأذكار اليومية</button>
            </div>
        </header>

        <div id="quran-section" class="tab-content">
            <div id="surahs-index-view">
                <h3 class="section-title">فهرس السور المباركة:</h3>
                <div class="surahs-grid" id="surahs-container"><div class="loading-text">جاري تحميل الفهرس...</div></div>
            </div>
            <div id="surah-reading-view" class="hidden">
                <div class="navigation-bar"><button onclick="backToSurahsIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الفهرس</button><h3 id="current-surah-title" class="surah-header-title"></h3></div>
                <div class="quran-card-reader"><p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p><div id="surah-text-content" class="quran-verses-text"></div></div>
            </div>
        </div>

        <div id="azkar-section" class="tab-content hidden">
            <div id="azkar-index-view">
                <h3 class="section-title">أذكار الحفظ والتحصين اليومي:</h3>
                <div class="azkar-categories-grid">
                    <div class="azkar-card category-sabah" onclick="loadAzkarData('sabah', 'أذكار الصباح ☀️')"><i class="fas fa-sun"></i><h3>أذكار الصباح</h3></div>
                    <div class="azkar-card category-masaa" onclick="loadAzkarData('masaa', 'أذكار المساء 🌙')"><i class="fas fa-moon"></i><h3>أذكار المساء</h3></div>
                </div>
            </div>
            <div id="azkar-list-view" class="hidden">
                <div class="navigation-bar"><button onclick="backToAzkarIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الأقسام</button><h3 id="current-azkar-title" class="section-title"></h3></div>
                <div class="azkar-list-container" id="azkar-container"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.protocol + "//" + window.location.host;
        window.onload = function() { loadSurahsIndex(); };

        function switchTab(t) {
            document.getElementById('quran-section').classList.add('hidden'); document.getElementById('azkar-section').classList.add('hidden');
            document.getElementById('tab-quran').classList.remove('active-tab'); document.getElementById('tab-azkar').classList.remove('active-tab');
            if(t === 'quran') { document.getElementById('quran-section').classList.remove('hidden'); document.getElementById('tab-quran').classList.add('active-tab'); backToSurahsIndex(); }
            else { document.getElementById('azkar-section').classList.remove('hidden'); document.getElementById('tab-azkar').classList.add('active-tab'); backToAzkarIndex(); }
        }

        async function loadSurahsIndex() {
            try {
                const r = await fetch(`${SERVER_URL}/api/surahs`), s = await r.json(), container = document.getElementById('surahs-container'); container.innerHTML = "";
                s.forEach(surah => {
                    const card = document.createElement('div'); card.className = "surah-item-card"; card.onclick = () => loadSurahContent(surah.id);
                    card.innerHTML = `<div class="surah-meta"><span class="surah-number">${surah.id}</span><div class="surah-name-box"><h3>سُورَةُ ${surah.name}</h3><p>${surah.type} • آياتها ${surah.verses_count}</p></div></div><i class="fas fa-chevron-left gold-arrow"></i>`; container.appendChild(card);
                });
            } catch (e) { alert("خطأ بالفهرس"); }
        }

        async function loadSurahContent(id) {
            try {
                const r = await fetch(`${SERVER_URL}/api/surah/${id}`), s = await r.json();
                document.getElementById('current-surah-title').innerText = "سُورَةُ " + s.name; document.getElementById('surah-text-content').innerText = s.content;
                document.getElementById('surahs-index-view').classList.add('hidden'); document.getElementById('surah-reading-view').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) { alert("خطأ بالآيات"); }
        }

        function backToSurahsIndex() { document.getElementById('surah-reading-view').classList.add('hidden'); document.getElementById('surahs-index-view').classList.remove('hidden'); }

        async function loadAzkarData(cat, title) {
            try {
                document.getElementById('current-azkar-title').innerText = title;
                const r = await fetch(`${SERVER_URL}/api/azkar?category=${cat}`), az = await r.json(), container = document.getElementById('azkar-container'); container.innerHTML = "";
                az.forEach((a, i) => {
                    const card = document.createElement('div'); card.className = "zekr-box-card";
                    card.innerHTML = `<p class="zekr-text">${a.text}</p><div class="counter-area"><button id="counter-btn-${i}" onclick="decreaseCounter(${i})" class="tasbeeh-btn"><span class="count-num" id="count-val-${i}">${a.count}</span><span class="count-lbl">تكرار</span></button></div>`; container.appendChild(card);
                });
                document.getElementById('azkar-index-view').classList.add('hidden'); document.getElementById('azkar-list-view').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) { alert("خطأ بالأذكار"); }
        }

        function decreaseCounter(i) {
            const num = document.getElementById(`count-val-${i}`), btn = document.getElementById(`counter-btn-${i}`); let val = parseInt(num.innerText);
            if (val > 0) { val--; num.innerText = val; btn.style.transform = "scale(0.9)"; setTimeout(() => btn.style.transform = "scale(1)", 80); if (val === 0) { btn.classList.add('completed-counter'); num.innerText = "✓"; } }
        }

        function backToAzkarIndex() { document.getElementById('azkar-list-view').classList.add('hidden'); document.getElementById('azkar-index-view').classList.remove('hidden'); }
    </script>
</body>
</html>
