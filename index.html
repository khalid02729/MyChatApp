<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#061a13">
    <title>المصحف الشريف والأذكار</title>

    <link rel="stylesheet" href="style.css">

    <script>
        window.onerror = function (message, source, line, column) {
            alert(
                "🚨 مصيدة الأخطاء\n\n" +
                message +
                "\n\nالسطر: " + line +
                "\nالعمود: " + column
            );
            return false;
        };

        window.addEventListener("unhandledrejection", function (event) {
            alert("🚨 خطأ غير متوقع:\n" + event.reason);
        });
    </script>
</head>

<body>

<div class="app-container">

    <header class="app-header">
        <div class="logo-area">
            <div class="quran-logo">﷽</div>
            <div>
                <h1>المُصْحَفُ الشَّرِيفُ</h1>
                <p class="subtitle">القرآن الكريم والأذكار اليومية</p>
            </div>
        </div>

        <div class="main-tabs">
            <button id="tab-quran" class="tab-btn active-tab" onclick="switchTab('quran')">
                📖 القرآن
            </button>

            <button id="tab-azkar" class="tab-btn" onclick="switchTab('azkar')">
                📿 الأذكار
            </button>
        </div>
    </header>


    <!-- ================= القرآن ================= -->

    <section id="quran-section" class="tab-content">

        <div id="surahs-index-view">

            <div class="top-title-row">
                <div>
                    <h2>فهرس القرآن الكريم</h2>
                    <p id="surah-count-text">جاري تحميل السور...</p>
                </div>
            </div>

            <div class="search-box">
                <span>🔎</span>
                <input
                    id="surah-search"
                    type="search"
                    placeholder="ابحث باسم السورة أو رقمها..."
                    autocomplete="off"
                    oninput="filterSurahs()"
                >
            </div>

            <div id="last-read-box" class="last-read hidden">
                <div>
                    <small>آخر قراءة</small>
                    <strong id="last-read-title"></strong>
                </div>

                <button onclick="continueLastRead()">
                    متابعة
                </button>
            </div>

            <div id="surahs-container" class="surahs-grid"></div>

            <div id="surahs-empty" class="empty-state hidden">
                لا توجد نتائج للبحث.
            </div>

        </div>


        <!-- شاشة السورة -->

        <div id="surah-reading-view" class="hidden">

            <div class="navigation-bar">

                <button class="back-btn" onclick="backToSurahsIndex()">
                    ← الفهرس
                </button>

                <div class="surah-title-area">
                    <strong id="current-surah-title"></strong>
                    <small id="current-surah-info"></small>
                </div>

                <button class="small-action" onclick="toggleCurrentFavorite()">
                    ☆
                </button>

            </div>


            <div class="reader-actions">

                <button onclick="changeFontSize(-1)">A−</button>
                <button onclick="resetFontSize()">A</button>
                <button onclick="changeFontSize(1)">A+</button>

            </div>


            <article id="verses-text-box" class="quran-card-reader">
                <div class="loading-text">جاري تحميل الآيات...</div>
            </article>

        </div>

    </section>


    <!-- ================= الأذكار ================= -->

    <section id="azkar-section" class="tab-content hidden">

        <div id="azkar-index-view">

            <h2 class="section-title">الأذكار اليومية</h2>

            <div class="azkar-categories-grid">

                <button
                    class="azkar-card category-sabah"
                    onclick="loadAzkarData('sabah', 'أذكار الصباح')"
                >
                    <div class="azkar-icon">☀️</div>
                    <h3>أذكار الصباح</h3>
                    <p>ابدأ يومك بذكر الله</p>
                </button>

                <button
                    class="azkar-card category-masaa"
                    onclick="loadAzkarData('masaa', 'أذكار المساء')"
                >
                    <div class="azkar-icon">🌙</div>
                    <h3>أذكار المساء</h3>
                    <p>اختم يومك بذكر الله</p>
                </button>

            </div>

        </div>


        <div id="azkar-list-view" class="hidden">

            <div class="navigation-bar">

                <button class="back-btn" onclick="backToAzkarIndex()">
                    ← الأقسام
                </button>

                <strong id="current-azkar-title"></strong>

            </div>

            <div id="azkar-container" class="azkar-list-container"></div>

        </div>

    </section>

</div>


<script>

const SERVER_URL = window.location.origin;

let allSurahs = [];
let currentSurahId = null;
let currentSurahName = "";
let currentFontSize = 25;


/* ================= أدوات عامة ================= */

async function api(url, options = {}) {

    const response = await fetch(SERVER_URL + url, options);

    let data = null;

    try {
        data = await response.json();
    } catch {
        throw new Error("السيرفر أرسل استجابة غير صالحة");
    }

    if (!response.ok) {
        throw new Error(data.error || "حدث خطأ في السيرفر");
    }

    return data;
}


/* ================= بداية التطبيق ================= */

window.addEventListener("load", async function () {

    try {

        await loadSurahsIndex();
        showLastRead();

    } catch (error) {

        console.error(error);

        document.getElementById("surahs-container").innerHTML =
            `<div class="error-box">
                ❌ تعذر تحميل القرآن.<br>
                ${escapeHtml(error.message)}
            </div>`;

    }

});


/* ================= التبويبات ================= */

function switchTab(tab) {

    const quran = document.getElementById("quran-section");
    const azkar = document.getElementById("azkar-section");

    const quranButton = document.getElementById("tab-quran");
    const azkarButton = document.getElementById("tab-azkar");

    quran.classList.add("hidden");
    azkar.classList.add("hidden");

    quranButton.classList.remove("active-tab");
    azkarButton.classList.remove("active-tab");

    if (tab === "quran") {

        quran.classList.remove("hidden");
        quranButton.classList.add("active-tab");

    } else {

        azkar.classList.remove("hidden");
        azkarButton.classList.add("active-tab");

    }

}


/* ================= فهرس السور ================= */

async function loadSurahsIndex() {

    const container = document.getElementById("surahs-container");

    container.innerHTML =
        `<div class="loading-text">جاري تحميل سور القرآن الكريم...</div>`;

    const data = await api("/api/surahs");

    allSurahs = data;

    document.getElementById("surah-count-text").innerText =
        `${data.length} سورة`;

    renderSurahs(data);
}


function renderSurahs(list) {

    const container = document.getElementById("surahs-container");

    container.innerHTML = "";

    if (!list.length) {

        document.getElementById("surahs-empty").classList.remove("hidden");

        return;
    }

    document.getElementById("surahs-empty").classList.add("hidden");


    list.forEach(surah => {

        const card = document.createElement("button");

        card.className = "surah-item-card";

        card.onclick = function () {
            loadSurahVerses(surah.id);
        };


        card.innerHTML = `
            <div class="surah-number">
                ${surah.id}
            </div>

            <div class="surah-main-info">

                <h3>سُورَةُ ${escapeHtml(surah.name)}</h3>

                <div class="surah-details">
                    <span>${escapeHtml(surah.type)}</span>
                    <span>•</span>
                    <span>${surah.number_of_ayahs} آية</span>
                </div>

            </div>

            <div class="surah-arrow">
                ←
            </div>
        `;

        container.appendChild(card);

    });

}


function filterSurahs() {

    const value =
        document.getElementById("surah-search")
        .value
        .trim()
        .toLowerCase();

    if (!value) {

        renderSurahs(allSurahs);
        return;
    }

    const filtered = allSurahs.filter(surah => {

        return (
            surah.name.toLowerCase().includes(value) ||
            String(surah.id) === value
        );

    });

    renderSurahs(filtered);
}


/* ================= قراءة السورة ================= */

async function loadSurahVerses(surahId) {

    currentSurahId = surahId;

    const box = document.getElementById("verses-text-box");

    box.innerHTML =
        `<div class="loading-text">جاري تحميل السورة...</div>`;

    document.getElementById("surahs-index-view")
        .classList.add("hidden");

    document.getElementById("surah-reading-view")
        .classList.remove("hidden");

    window.scrollTo(0, 0);


    try {

        const data =
            await api(`/api/surah/${surahId}`);


        currentSurahName = data.name;


        document.getElementById("current-surah-title")
            .innerText = "سُورَةُ " + data.name;


        document.getElementById("current-surah-info")
            .innerText =
            `${data.type} • ${data.verses.length} آية`;


        let html = "";


        if (surahId !== 9) {

            html += `
                <div class="bismillah">
                    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
                </div>
            `;

        }


        html += `<div class="quran-text">`;


        data.verses.forEach(verse => {

            html += `
                <span
                    class="single-verse"
                    id="verse-${verse.verse_number}"
                    onclick="saveLastRead(${surahId}, '${escapeAttribute(data.name)}', ${verse.verse_number})"
                >

                    ${escapeHtml(verse.text)}

                    <span class="verse-number">
                        ${toArabicNumber(verse.verse_number)}
                    </span>

                </span>
            `;

        });


        html += `</div>`;


        box.innerHTML = html;

        applyFontSize();

        saveLastRead(surahId, data.name, 1);

    } catch (error) {

        box.innerHTML =
            `<div class="error-box">
                ❌ ${escapeHtml(error.message)}
            </div>`;

    }

}


function backToSurahsIndex() {

    document.getElementById("surah-reading-view")
        .classList.add("hidden");

    document.getElementById("surahs-index-view")
        .classList.remove("hidden");

}


/* ================= حجم الخط ================= */

function changeFontSize(value) {

    currentFontSize += value;

    if (currentFontSize < 19)
        currentFontSize = 19;

    if (currentFontSize > 34)
        currentFontSize = 34;

    applyFontSize();
}


function resetFontSize() {

    currentFontSize = 25;

    applyFontSize();
}


function applyFontSize() {

    document.documentElement.style
        .setProperty("--quran-font-size", currentFontSize + "px");

}


/* ================= آخر قراءة ================= */

function saveLastRead(surahId, name, verse) {

    localStorage.setItem(
        "quran_last_read",
        JSON.stringify({
            surahId,
            name,
            verse
        })
    );

    showLastRead();
}


function showLastRead() {

    const saved =
        localStorage.getItem("quran_last_read");

    if (!saved) return;

    try {

        const data = JSON.parse(saved);

        document.getElementById("last-read-title")
            .innerText =
            `سورة ${data.name} — الآية ${data.verse}`;

        document.getElementById("last-read-box")
            .classList.remove("hidden");

    } catch {}

}


function continueLastRead() {

    const saved =
        localStorage.getItem("quran_last_read");

    if (!saved) return;

    const data = JSON.parse(saved);

    loadSurahVerses(data.surahId);

}


/* ================= المفضلة ================= */

function toggleCurrentFavorite() {

    if (!currentSurahId) return;

    let favorites =
        JSON.parse(localStorage.getItem("quran_favorites") || "[]");

    if (favorites.includes(currentSurahId)) {

        favorites =
            favorites.filter(id => id !== currentSurahId);

    } else {

        favorites.push(currentSurahId);

    }

    localStorage.setItem(
        "quran_favorites",
        JSON.stringify(favorites)
    );

    updateFavoriteButton();

}


function updateFavoriteButton() {

    const button =
        document.querySelector(".small-action");

    const favorites =
        JSON.parse(localStorage.getItem("quran_favorites") || "[]");

    button.innerText =
        favorites.includes(currentSurahId) ? "★" : "☆";

}


/* ================= الأذكار ================= */

async function loadAzkarData(category, title) {

    document.getElementById("azkar-index-view")
        .classList.add("hidden");

    document.getElementById("azkar-list-view")
        .classList.remove("hidden");

    document.getElementById("current-azkar-title")
        .innerText = title;

    const container =
        document.getElementById("azkar-container");

    container.innerHTML =
        `<div class="loading-text">جاري تحميل الأذكار...</div>`;


    try {

        const data =
            await api(`/api/azkar?category=${category}`);

        container.innerHTML = "";


        data.forEach((zekr, index) => {

            const card =
                document.createElement("div");

            card.className = "zekr-box-card";

            card.innerHTML = `

                <div class="zekr-number">
                    ${index + 1}
                </div>

                <p class="zekr-text">
                    ${escapeHtml(zekr.text)}
                </p>

                <div class="counter-area">

                    <button
                        class="tasbeeh-btn"
                        id="counter-btn-${index}"
                        onclick="cnt(${index}, ${zekr.count})"
                    >

                        <span
                            class="count-num"
                            id="count-val-${index}"
                        >
                            ${zekr.count}
                        </span>

                        <span class="count-lbl">
                            تكرار
                        </span>

                    </button>

                </div>

            `;

            container.appendChild(card);

        });

    } catch (error) {

        container.innerHTML =
            `<div class="error-box">
                ❌ ${escapeHtml(error.message)}
            </div>`;

    }

}


function cnt(index, originalCount) {

    const number =
        document.getElementById(`count-val-${index}`);

    const button =
        document.getElementById(`counter-btn-${index}`);

    let value =
        parseInt(number.dataset.remaining || number.innerText);

    if (isNaN(value))
        value = originalCount;


    if (value > 0) {

        value--;

        number.dataset.remaining = value;

        number.innerText = value;


        if (value === 0) {

            number.innerText = "✓";

            button.classList.add("completed-counter");

        }

    }

}


function backToAzkarIndex() {

    document.getElementById("azkar-list-view")
        .classList.add("hidden");

    document.getElementById("azkar-index-view")
        .classList.remove("hidden");

}


/* ================= حماية النص ================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttribute(text) {

    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
}


function toArabicNumber(number) {

    const arabic = "٠١٢٣٤٥٦٧٨٩";

    return String(number)
        .replace(/[0-9]/g, digit => arabic[digit]);

}

</script>

</body>
</html>
