<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف والأذكار</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>window.onerror = function(m, u, l) { alert("🚨 مصيدة الأخطاء:\n" + m + "\nفي السطر: " + l); return false; };</script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area"><i class="fas fa-quran animated-quran"></i><h1>المُصْحَفُ الشَّرِيفُ</h1></div>
            <p class="subtitle">قراءة الآيات نصيّاً آية آية بالترقيم العثماني الصحيح</p>
            <div class="main-tabs">
                <button onclick="switchTab('quran')" id="tab-quran" class="tab-btn active-tab">فهرس السور</button>
                <button onclick="switchTab('azkar')" id="tab-azkar" class="tab-btn">الأذكار والتحصين</button>
            </div>
        </header>

        <div id="quran-section" class="tab-content">
            <div id="surahs-index-view">
                <h3 class="section-title">فهرس سور القرآن الكريم:</h3>
                <div class="surahs-grid" id="surahs-container"></div>
            </div>
            
            <!-- شاشة القراءة النصية الكاملة والمنسقة آية آية -->
            <div id="surah-reading-view" class="hidden">
                <div class="navigation-bar">
                    <button onclick="backToSurahsIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الفهرس</button>
                    <h3 id="current-surah-title" class="surah-header-title"></h3>
                </div>
                <!-- كرت القراءة المريح للعين بنصوص صافية -->
                <div class="quran-card-reader" id="verses-text-box"></div>
            </div>
        </div>

        <div id="azkar-section" class="tab-content hidden">
            <div id="azkar-index-view">
                <h3 class="section-title">الأذكار اليومية المكتملة:</h3>
                <div class="azkar-categories-grid">
                    <div class="azkar-card category-sabah" onclick="loadAzkarData('sabah', 'أذكار الصباح ☀️')"><i class="fas fa-sun"></i><h3>أذكار الصباح كاملة</h3></div>
                    <div class="azkar-card category-masaa" onclick="loadAzkarData('masaa', 'أذكار المساء 🌙')"><i class="fas fa-moon"></i><h3>أذكار المساء كاملة</h3></div>
                </div>
            </div>
            <div id="azkar-list-view" class="hidden">
                <div class="navigation-bar"><button onclick="backToAzkarIndex()" class="back-btn"><i class="fas fa-arrow-right"></i> الأقسام</button><h3 id="current-azkar-title" class="section-title"></h3></div>
                <div class="azkar-list-container" id="azkar-container"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.protocol + "//" + window.location.host;

        window.onload = function() { loadSurahsIndex(); };

        function switchTab(t) {
            document.getElementById('quran-section').classList.add('hidden'); document.getElementById('azkar-section').classList.add('hidden');
            document.getElementById('tab-quran').classList.remove('active-tab'); document.getElementById('tab-azkar').classList.remove('active-tab');
            if(t === 'quran') { document.getElementById('quran-section').classList.remove('hidden'); document.getElementById('tab-quran').classList.add('active-tab'); backToSurahsIndex(); }
            else { document.getElementById('azkar-section').classList.remove('hidden'); document.getElementById('tab-azkar').classList.add('active-tab'); backToAzkarIndex(); }
        }

        async function loadSurahsIndex() {
            try {
                const r = await fetch(`${SERVER_URL}/api/surahs`), s = await r.json(), c = document.getElementById('surahs-container'); c.innerHTML = "";
                s.forEach(su => {
                    const d = document.createElement('div'); d.className = "surah-item-card"; d.onclick = () => loadSurahVerses(su.id);
                    d.innerHTML = `<div class="surah-meta"><span class="surah-number">۝</span><div class="surah-name-box"><h3>سُورَةُ ${su.name}</h3><p>${su.type}</p></div></div><i class="fas fa-chevron-left gold-arrow"></i>`; c.appendChild(d);
                });
            } catch(e){}
        }

        // 🎯 جلب الآيات آية آية وعرضها بالترقيم العثماني الصحيح 
        async function loadSurahVerses(surahId) {
            try {
                const r = await fetch(`${SERVER_URL}/api/surah/${surahId}`), data = await r.json();
                document.getElementById('current-surah-title').innerText = "سُورَةُ " + data.name;
                
                const box = document.getElementById('verses-text-box');
                box.innerHTML = "";
                
                // إضافة البسملة في هيدر مستقل
                if(surahId !== 1) { box.innerHTML += `<p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>`; }
                
                let fullSurahText = "";
                data.verses.forEach(v => {
                    // نربط نص الآية وجنبها رقمها العثماني المبارك من قاعدة البيانات مباشرة
                    fullSurahText += `<span class="single-verse">${v.text} <span class="verse-num-badge">﴿${v.verse_number}﴾</span> </span>`;
                });
                
                box.innerHTML += `<div class="quran-verses-text">${fullSurahText}</div>`;
                
                document.getElementById('surahs-index-view').classList.add('hidden'); 
                document.getElementById('surah-reading-view').classList.remove('hidden'); 
                window.scrollTo(0,0);
            } catch(e){ alert("خطأ جلب الآيات"); }
        }

        function backToSurahsIndex() { document.getElementById('surah-reading-view').classList.add('hidden'); document.getElementById('surahs-index-view').classList.remove('hidden'); }

        async function loadAzkarData(cat, title) {
            try {
                document.getElementById('current-azkar-title').innerText = title;
                const r = await fetch(`${SERVER_URL}/api/azkar?category=${cat}`), az = await r.json(), c = document.getElementById('azkar-container'); c.innerHTML = "";
                az.forEach((a, i) => {
                    const d = document.createElement('div'); d.className = "zekr-box-card";
                    d.innerHTML = `<p class="zekr-text">${a.text}</p><div class="counter-area"><button id="counter-btn-${i}" onclick="cnt(${i})" class="tasbeeh-btn"><span class="count-num" id="count-val-${i}">${a.count}</span><span class="count-lbl">تكرار</span></button></div>`; c.appendChild(d);
                });
                document.getElementById('azkar-index-view').classList.add('hidden'); document.getElementById('azkar-list-view').classList.remove('hidden'); window.scrollTo(0,0);
            } catch(e){}
        }
        function cnt(i) {
            const n = document.getElementById(`count-val-${i}`), b = document.getElementById(`counter-btn-${i}`); let v = parseInt(n.innerText);
            if (v > 0) { v--; n.innerText = v; if (v === 0) { b.classList.add('completed-counter'); n.innerText = "✓"; } }
        }
        function backToAzkarIndex() { document.getElementById('azkar-list-view').classList.add('hidden'); document.getElementById('azkar-index-view').classList.remove('hidden'); }
    </script>
</body>
</html>
